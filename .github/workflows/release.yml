name: Release

# A `v*` tag builds every tarball, smoke-tests it, and drafts a GitHub release
# with them, the `.sha256` of each (which `install.sh` checks) and
# SHA256SUMS; publishing the draft is left to a person. Pull
# requests that touch packaging build and smoke-test without releasing.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - packaging/**
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  cli:
    name: kagebunshin (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported runners, for the oldest glibc the binaries need.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # No build cache: a release is built from nothing but the tagged tree.
      - run: rustup toolchain install
      - id: version
        run: |
          id=$(cargo pkgid -p kagebunshin)
          version=${id##*[#@]}
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "the tag $GITHUB_REF_NAME does not match the crate version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: cargo build --release --locked -p kagebunshin
      - id: pack
        run: echo "tarball=$(packaging/tarball.sh target/release/kagebunshin kagebunshin ${{ steps.version.outputs.version }} ${{ matrix.target }})" >> "$GITHUB_OUTPUT"
      - name: Smoke test the tarball
        run: python3 -I packaging/smoke.py ${{ steps.pack.outputs.tarball }} ${{ steps.version.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: kagebunshin-${{ matrix.target }}
          path: dist/

  # The app, built and shipped apart from the CLI.
  app:
    name: kagebunshin-app (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libvulkan1 mesa-vulkan-drivers
      - id: version
        run: |
          id=$(cargo pkgid -p kagebunshin)
          echo "version=${id##*[#@]}" >> "$GITHUB_OUTPUT"
      - run: cargo build --release --locked -p kagebunshin-app
      - id: pack
        run: echo "tarball=$(packaging/tarball.sh target/release/kagebunshin-app kagebunshin-app ${{ steps.version.outputs.version }} ${{ matrix.target }})" >> "$GITHUB_OUTPUT"
      - name: Render a scene from the tarball
        if: runner.os == 'Linux'
        run: |
          # lavapipe; 22.04 names its ICD file after the architecture.
          VK_ICD_FILENAMES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json)
          export VK_ICD_FILENAMES
          d=$(mktemp -d)
          tar -C "$d" -xzf ${{ steps.pack.outputs.tarball }}
          export HOME="$d/home" XDG_CONFIG_HOME="$d/config" XDG_STATE_HOME="$d/state"
          "$d"/kagebunshin-app-*/kagebunshin-app --snap "$d/unlocked.png" --scene unlocked --theme dark
          test -s "$d/unlocked.png"
      - uses: actions/upload-artifact@v4
        with:
          name: kagebunshin-app-${{ matrix.target }}
          path: dist/

  release:
    name: draft the release
    if: github.ref_type == 'tag'
    needs: [cli, app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && cat *.sha256 > SHA256SUMS && cat SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.sha256 dist/SHA256SUMS
          --repo "$GITHUB_REPOSITORY" --draft --verify-tag
          --title "kagebunshin $GITHUB_REF_NAME" --generate-notes
