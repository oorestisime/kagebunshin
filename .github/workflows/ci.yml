name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # `desktop-file-validate`, which the launcher's test runs.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends desktop-file-utils
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  # The app is outside the default members, so the job above never builds it.
  app:
    name: app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: app
      # Build headers, and lavapipe for headless rendering without a GPU.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev mesa-vulkan-drivers
      - run: cargo clippy -p kagebunshin-app --all-targets --locked -- -D warnings
      - run: cargo test -p kagebunshin-app --locked
      - run: cargo build -p kagebunshin-app --locked
      - name: Render every scene, light and dark
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: |
          mkdir -p snaps
          export HOME="$RUNNER_TEMP/home" XDG_CONFIG_HOME="$RUNNER_TEMP/config"
          for scene in unlocked locked down error empty confirm passphrase adding; do
            for theme in light dark; do
              target/debug/kagebunshin-app --snap "snaps/$scene-$theme.png" --scene "$scene" --theme "$theme"
            done
          done
      - uses: actions/upload-artifact@v4
        with:
          name: app-snaps
          path: snaps/

  # macOS after a merge only: its runners are slow to come by, and a pull
  # request should not wait for one. Tests alone, in one job: formatting
  # is the same everywhere, and with RUSTFLAGS above the test build fails
  # on a warning in the code that only macOS compiles.
  macos:
    name: test (macos-latest)
    if: github.event_name == 'push'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo test -p kagebunshin-app --locked

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
