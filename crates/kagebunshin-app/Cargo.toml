[package]
name = "kagebunshin-app"
description = "A window onto the kagebunshin daemon: projects, sources and where each key comes from."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Rune is not on crates.io, and crates.io refuses git dependencies.
publish = false

[lints]
workspace = true

[[bin]]
name = "kagebunshin-app"
path = "src/main.rs"

[dependencies]
kagebunshin = { path = "../kagebunshin", version = "0.0.1-alpha.18" }
# Prerelease: pinned to a commit on `dev`, which is never rewritten. Without
# the audio and SVG decoders, which the app does not use.
rune = { version = "0.0.1", git = "https://github.com/anomalyco/rune", rev = "bba30a61cfcec6683e3fdedf156a92dae89d8b04", default-features = false, features = ["accessibility", "dbus", "embedded-fonts", "metal-backend"] }
# Draws the address a phone opens to be paired, as a QR code. Its modules
# only: the app paints them.
qrcodegen = "1.8.0"

[dev-dependencies]
tempfile = "3.27.0"
